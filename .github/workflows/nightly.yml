name: nightly

# The offline pipeline, every night (ADR 0006): snapshot today's OSV PyPI data, update the
# current release incrementally, run the release gate, publish a dated release and move the
# pointer on the db-pointer branch. With the GROQ_API_KEY secret, the night's changed
# vulnerabilities, then those still waiting for model picks, are also extracted and their
# picks merged before the gate (ADR 0013); without it, the run makes no model call. With the
# HF_TOKEN secret, each published release also goes to the Hugging Face dataset.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write # create the dated release and commit the pointer to db-pointer
      issues: write # open an issue when the run fails
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }} # update-db reads public commits with it
      HAS_GROQ: ${{ secrets.GROQ_API_KEY != '' }} # whether to extract (ADR 0013); not the key
      HAS_HF: ${{ secrets.HF_TOKEN != '' }} # whether to publish to Hugging Face; not the token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked --all-extras

      - name: Download the current release
        run: PATCHSIGHT_CACHE="$RUNNER_TEMP/previous" uv run patchsight db update

      - name: Snapshot today's OSV PyPI data
        run: uv run python -m patchsight.pipeline snapshot

      - name: Update the database
        run: >
          uv run python -m patchsight.pipeline update-db
          "$RUNNER_TEMP/previous/patchsight.sqlite" --out data/build/nightly

      - name: Check for changes
        id: changes
        run: |
          changed=$(uv run python -c "from pathlib import Path; from patchsight.pipeline import update_db as u; r = u.UpdateReport.model_validate_json(Path('data/build/nightly-update.json').read_text()); print(str(u.changed(r)).lower())")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "changed: $changed"

      - name: Check that tonight's release is new
        # A second run on the same UTC date publishes nothing, so it spends no model quota.
        id: release
        run: |
          version=$(uv run python -c "import sqlite3; print(dict(sqlite3.connect('data/build/nightly.sqlite').execute('SELECT key, value FROM meta'))['db_version'])")
          if gh release view "db-$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "db-$version is already published: this run publishes nothing and extracts nothing"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the night's changes and the backlog
        # ADR 0013: at most 25 a night, the night's changes first, then vulnerabilities still
        # waiting for model picks, also on a night with no change in OSV; skipped without the
        # GROQ_API_KEY secret.
        id: extract
        if: steps.release.outputs.new == 'true' && env.HAS_GROQ == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ids=$(uv run python -m patchsight.pipeline nightly-targets data/build/nightly-update.json \
            --db data/build/nightly.sqlite --limit 25 --report data/build/nightly-targets.json)
          if [ -z "$ids" ]; then
            echo "nothing to extract tonight"
            exit 0
          fi
          # Groq's daily cap stops the live pass with exit 2; every answer so far is cached.
          uv run python -m patchsight.pipeline pypi-extract --role extractor --ids "$ids" \
            --out data/build/nightly-extract || [ $? -eq 2 ]
          # Collect every cached answer, including those from before a stop.
          uv run python -m patchsight.pipeline pypi-extract --role extractor --ids "$ids" \
            --cache-only --offline --out data/build/nightly-extract
          echo "extracted=true" >> "$GITHUB_OUTPUT"

      - name: Merge the picks into the release
        id: merge
        if: steps.extract.outputs.extracted == 'true'
        run: |
          version=$(uv run python -c "import sqlite3; print(dict(sqlite3.connect('data/build/nightly.sqlite').execute('SELECT key, value FROM meta'))['db_version'])")
          uv run python -m patchsight.pipeline merge-llm data/build/nightly.sqlite \
            --version "$version" --llm data/build/nightly-extract-extractor.jsonl \
            --out data/build/nightly-merged
          mv data/build/nightly-merged.sqlite data/build/nightly.sqlite
          # New picks are a change worth publishing, even on a night with none in OSV.
          picks=$(uv run python -c "import json; r = json.load(open('data/build/nightly-merged-merge.json')); print(str(r['after']['records'] > r['before']['records']).lower())")
          echo "picks=$picks" >> "$GITHUB_OUTPUT"
          echo "new picks merged: $picks"

      - name: Read import names from wheels
        if: steps.changes.outputs.changed == 'true' || steps.merge.outputs.picks == 'true'
        run: >
          uv run python -m patchsight.pipeline import-names data/build/nightly.sqlite
          --previous "$RUNNER_TEMP/previous/patchsight.sqlite"

      - name: Release gate
        if: steps.changes.outputs.changed == 'true' || steps.merge.outputs.picks == 'true'
        run: >
          uv run python -m patchsight.pipeline gate-db data/build/nightly.sqlite
          --previous "$RUNNER_TEMP/previous/patchsight.sqlite" --out data/build/gate

      - name: Package and publish the release
        id: publish
        if: steps.changes.outputs.changed == 'true' || steps.merge.outputs.picks == 'true'
        run: |
          uv run python -m patchsight.pipeline package-db data/build/nightly.sqlite
          version=$(uv run python -c "import json; print(json.load(open('releases/latest.json'))['db_version'])")
          tag="db-$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $tag already exists: it is not created again, and the pointer stays"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          merge=()
          if [ -f data/build/nightly-merged-merge.json ]; then
            merge=(--merge data/build/nightly-merged-merge.json)
          fi
          uv run python -m patchsight.pipeline release-notes data/build/nightly.sqlite \
            --update data/build/nightly-update.json --gate data/build/gate.json "${merge[@]}" \
            --out data/build/release-notes.md
          gh release create "$tag" "data/build/release/patchsight-db-$version.sqlite.gz" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Symbol database $version" --notes-file data/build/release-notes.md
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Point the CLI at the new release
        if: steps.publish.outputs.published == 'true'
        env:
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --quiet --depth 1 --branch db-pointer \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$RUNNER_TEMP/pointer"
          cp releases/latest.json "$RUNNER_TEMP/pointer/latest.json"
          cd "$RUNNER_TEMP/pointer"
          if git diff --quiet; then
            echo "the pointer already names $TAG"
          else
            git commit --quiet -am "Point at $TAG"
            git push --quiet origin db-pointer
            echo "the pointer now names $TAG"
          fi

      - name: Publish to Hugging Face
        # The same release as a Hugging Face dataset version, tagged like it; skipped without
        # the HF_TOKEN secret.
        if: steps.publish.outputs.published == 'true' && env.HAS_HF == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          sha=$(uv run python -c "import json; print(json.load(open('releases/latest.json'))['sha256'])")
          uv run python -m patchsight.pipeline hf-publish \
            "data/build/release/patchsight-db-${TAG#db-}.sqlite.gz" --tag "$TAG" --expect-sha256 "$sha"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-reports
          # The night's model answers (.cache/llm/<ab>/<key>.json; never the usage ledger) are
          # kept too, so a shadow database can replay them. .cache is a hidden folder.
          include-hidden-files: true
          path: |
            data/build/nightly-update.json
            data/build/nightly-import-names.json
            data/build/gate.md
            data/build/gate.json
            data/build/release-notes.md
            data/build/nightly-targets.json
            data/build/nightly-extract-extractor-summary.json
            data/build/nightly-merged-merge.json
            data/interim/traces/*.jsonl
            .cache/llm/*/*.json
          if-no-files-found: ignore

      - name: Open an issue
        if: failure()
        run: |
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The nightly pipeline failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ -f data/build/gate.md ]; then cat data/build/gate.md; fi
          } > "$body"
          gh label create nightly --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Nightly pipeline" --force
          gh issue create --repo "$GITHUB_REPOSITORY" --label nightly --body-file "$body" \
            --title "Nightly pipeline failed on $(date -u +%Y-%m-%d)"
