[project]
name = "patchsight"
version = "0.8.0"
description = "Know which vulnerable Python dependencies your code actually calls: symbol-level triage, no LLM at scan time."
readme = "docs/pypi.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Niroj33" }]
keywords = [
    "security", "vulnerability", "dependencies", "supply-chain", "sca",
    "static-analysis", "reachability", "osv", "pypi", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "packaging>=26.3",
    "pydantic>=2.14.3",
    "tenacity>=9.2.1",
    "typer>=0.29.1",
]

[project.scripts]
patchsight = "patchsight.cli:app"

[project.urls]
Homepage = "https://github.com/professor3333/PatchSight"
Source = "https://github.com/professor3333/PatchSight"
Issues = "https://github.com/professor3333/PatchSight/issues"
Releases = "https://github.com/professor3333/PatchSight/releases"
Benchmark = "https://github.com/professor3333/PatchSight#results-at-a-glance"

[project.optional-dependencies]
pipeline = [
    "openai>=3.51.0",
    "tokenizers>=0.23.3",
    "tree-sitter>=0.26.1",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-python>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Programs that are scanned, never run; one is Python 2 on purpose.
extend-exclude = ["tests/fixtures/reachability"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]  # fake credentials in tests
# Kaggle notebooks run on a throwaway VM: asserts are the user-facing checks, the work dir is
# /tmp, and subprocess and urlopen calls use fixed commands and a localhost URL.
"notebooks/**" = ["S101", "S108", "S310", "S603", "S607", "PTH", "SIM115"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls the network or a live model; nightly only",
    "slow: long-running; release workflow only",
]
