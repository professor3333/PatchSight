name: Bug report
description: Something in the CLI or the pipeline does not work as documented.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: PatchSight version
      description: Output of `patchsight --version`.
      placeholder: patchsight 0.3.0
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database version
      description: The `db_version` line of `patchsight db info`, if the problem involves a scan.
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Include the full output or error. Remove anything private.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: lockfile
    attributes:
      label: Lockfile format
      options:
        - requirements.txt
        - uv.lock
        - poetry.lock
        - not relevant
