[project]
name = "patchsight"
version = "0.0.1.dev0"
description = "Symbol-level vulnerability triage for Python dependencies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "typer>=0.29.1",
]

[project.scripts]
patchsight = "patchsight.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls the network or a live model; nightly only",
    "slow: long-running; release workflow only",
]
