name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest -m "not live and not slow"

      - name: Reproduce the benchmark table
        run: uv run python -m patchsight.pipeline reproduce

      - name: Replay the PyPI regression set
        run: uv run python -m patchsight.pipeline regression-check

      - name: Check the frozen evaluation sets
        run: uv run python -m patchsight.pipeline eval-sets
