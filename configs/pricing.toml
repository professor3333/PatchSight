# What the pipeline's model work would cost at a provider's paid rates (proposal §11), for the
# operations report. PatchSight itself runs on Kaggle's free GPUs and Groq's free tier, and a
# scan calls no model at all.
#
# Groq's published on-demand prices, US dollars per million tokens, read from the "Production
# Models" table of https://console.groq.com/docs/models on 2026-11-22. Re-read them before
# quoting a cost: prices change.
source = "https://console.groq.com/docs/models"
retrieved = 2026-11-22

[models."qwen/qwen3.8-27b"]
input = 0.80
output = 4.00

[models."openai/gpt-oss-120b"]
input = 0.15
output = 0.60

[models."openai/gpt-oss-20b"]
input = 0.075
output = 0.30

