[[advisory]]
id = "GHSA-j8r2-6x86-q33q"
package = "requests"
version = "2.30.0"
import_roots = ["requests"]
symbols = ["requests.sessions:SessionRedirectMixin.rebuild_proxies"]
entry_points = [
    "requests.request",
    "requests.get",
    "requests.head",
    "requests.post",
    "requests.put",
    "requests.patch",
    "requests.delete",
    "requests.options",
    "requests.Session",
    "requests.sessions.Session",
]
note = "Proxy-Authorization leaks on redirects; any request through a proxy can follow one."

