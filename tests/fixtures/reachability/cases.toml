[[advisory]]
id = "GHSA-7p73-8jqx-23r8"
package = "langgraph-checkpoint-sqlite"
version = "2.0.10"
import_roots = ["langgraph"]
symbols = [
    "langgraph.store.sqlite.base:SqliteStore._get_filter_condition",
    "langgraph.store.sqlite.base:BaseSqliteStore._prepare_batch_search_queries",
]
entry_points = [
    "langgraph.store.sqlite.SqliteStore",
    "langgraph.store.sqlite.SqliteStore.search",
]
note = "SQL injection through filter keys. The distribution lives in a monorepo and imports as langgraph."

