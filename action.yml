name: PatchSight scan
description: Rank dependency alerts by whether your code references the vulnerable functions. No LLM and no server at scan time.
author: Niroj33
branding:
  icon: shield
  color: green

inputs:
  path:
    description: Project directory to scan, relative to the repository root.
    required: false
    default: "."
  lockfile:
    description: requirements.txt, uv.lock or poetry.lock. By default, the first one found in path.
    required: false
    default: ""
  fail-on:
    description: Fail the step when an alert is "called", "unknown" (unknown or called), or "never".
    required: false
    default: never
  sarif-file:
    description: Where to write the SARIF report.
    required: false
    default: patchsight.sarif
  upload-sarif:
    description: 'Upload the report to GitHub code scanning ("true" or "false"). The job then needs `security-events: write`.'
    required: false
    default: "true"
  comment:
    description: 'On a pull request, post the report as a comment and update that comment on later pushes ("true" or "false"). The job then needs `pull-requests: write`.'
    required: false
    default: "false"
  github-token:
    description: Token for the pull-request comment.
    required: false
    default: ${{ github.token }}

outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.scan.outputs.sarif-file }}
  report-file:
    description: Path of the markdown report (the job summary and the pull-request comment).
    value: ${{ steps.scan.outputs.report-file }}
  alerts:
    description: Number of alerts.
    value: ${{ steps.scan.outputs.alerts }}
  called:
    description: Number of CALLED alerts.
    value: ${{ steps.scan.outputs.called }}
  unknown:
    description: Number of UNKNOWN alerts.
    value: ${{ steps.scan.outputs.unknown }}

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install PatchSight
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        VENV: ${{ runner.temp }}/patchsight-venv
      run: |
        # Its own virtualenv and Python, so the job's Python is left alone.
        uv venv --quiet --python 3.12 "$VENV"
        uv pip install --quiet --python "$VENV/bin/python" "$ACTION_PATH"

    - name: Scan
      id: scan
      shell: bash
      env:
        PATCHSIGHT: ${{ runner.temp }}/patchsight-venv/bin/patchsight
        PYTHON: ${{ runner.temp }}/patchsight-venv/bin/python
        PATCHSIGHT_CACHE: ${{ runner.temp }}/patchsight-cache
        INPUT_PATH: ${{ inputs.path }}
        INPUT_LOCKFILE: ${{ inputs.lockfile }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        case "$INPUT_FAIL_ON" in
          called|unknown|never) ;;
          *) echo "::error::fail-on must be called, unknown or never, not '$INPUT_FAIL_ON'"; exit 2 ;;
        esac
        "$PATCHSIGHT" db update
        args=(scan "$INPUT_PATH" --format sarif)
        if [ -n "$INPUT_LOCKFILE" ]; then args+=(--lockfile "$INPUT_LOCKFILE"); fi
        "$PATCHSIGHT" "${args[@]}" > "$SARIF_FILE"
        report="$RUNNER_TEMP/patchsight-report.md"
        markdown=(scan "$INPUT_PATH" --format markdown)
        if [ -n "$INPUT_LOCKFILE" ]; then markdown+=(--lockfile "$INPUT_LOCKFILE"); fi
        "$PATCHSIGHT" "${markdown[@]}" > "$report"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        echo "report-file=$report" >> "$GITHUB_OUTPUT"
        "$PYTHON" -I - "$SARIF_FILE" <<'PY'
        import collections, json, os, sys

        path = sys.argv[1]
        run = json.load(open(path, encoding="utf-8"))["runs"][0]
        results = run["results"]
        counts = collections.Counter(r["properties"]["verdict"] for r in results)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"sarif-file={path}\nalerts={len(results)}\n")
            out.write(f"called={counts['CALLED']}\nunknown={counts['UNKNOWN']}\n")
        verdicts = ("CALLED", "IMPORTED_NOT_CALLED", "NOT_IMPORTED", "UNKNOWN")
        print(f"{len(results)} alerts: " + ", ".join(f"{v} {counts[v]}" for v in verdicts))
        PY

    - name: Upload to code scanning
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: patchsight

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request.number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        NUMBER: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.scan.outputs.report-file }}
        SCRIPT: ${{ github.action_path }}/scripts/pr-comment.sh
      run: bash "$SCRIPT"

    - name: Apply fail-on
      shell: bash
      env:
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        CALLED: ${{ steps.scan.outputs.called }}
        UNKNOWN: ${{ steps.scan.outputs.unknown }}
      run: |
        if [ "$INPUT_FAIL_ON" = called ] && [ "$CALLED" -gt 0 ]; then
          echo "::error::$CALLED alert(s) are CALLED"; exit 1
        fi
        if [ "$INPUT_FAIL_ON" = unknown ] && [ $((CALLED + UNKNOWN)) -gt 0 ]; then
          echo "::error::$CALLED alert(s) are CALLED and $UNKNOWN UNKNOWN"; exit 1
        fi
