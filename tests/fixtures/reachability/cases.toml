# Reachability fixtures: small programs whose direct use of a vulnerable symbol is
# known. See README.md. Advisory text is not copied here: IDs, package versions and
# symbol names only. Symbols are written module:qualname.

[[advisory]]
id = "GHSA-8q59-q68h-6hv4"
package = "pyyaml"
version = "5.3.1"
import_roots = ["yaml"]
symbols = ["yaml.constructor:FullConstructor"]
entry_points = [
    "yaml.full_load",
    "yaml.full_load_all",
    "yaml.FullLoader",
    "yaml.load",
    "yaml.load_all",
]
note = "FullLoader constructs arbitrary Python objects. In 5.3.1, load() without a Loader uses FullLoader."

[[advisory]]
id = "GHSA-8vj2-vxx3-667w"
package = "pillow"
version = "8.4.0"
